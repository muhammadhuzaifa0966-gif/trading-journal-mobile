name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22     
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install and build the web app
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build debug APK (for testing on your phone)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TradeLogsPro-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk TradeLogsPro.apk
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest TradeLogsPro.apk --prerelease \
            --title "TradeLogs Pro (test build)" \
            --notes "Debug APK for testing. Download TradeLogsPro.apk on your phone and install it."

      # ---- Play Store build: only runs when the signing secrets are set ----
      - name: Build release bundle (AAB)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Sign release bundle
        if: env.HAS_KEYSTORE == 'true'
        id: sign
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload signed AAB for Play Store
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TradeLogsPro-playstore-aab
          path: ${{ steps.sign.outputs.signedReleaseFile }}
